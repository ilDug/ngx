<div class="container">
    <div class="titles">
        <h1>DAG-NGX</h1>
        <h3>Utilities for Angular applications</h3>
        <div class="nav">
            <a class="btn" (click)="section.set('errors')">errors</a>
            <a class="btn" (click)="section.set('drag-and-drop')">drag-and-drop</a>
            <a class="btn" (click)="section.set('loader')">loader</a>
            <a class="btn" (click)="section.set('textarea')">textarea</a>
        </div>
    </div>

    <div id="github">
        <a href="https://github.com/ilDug/ngx" target="_blank" rel="noopener">
            <span>
                <img src="github.svg" alt="fork me on github" title="fork me on github" />
            </span>
        </a>
    </div>

    <div class="content">
        @switch (section()) {
            @case ('errors') {
                <demo-errors />
            }

            @case ('drag-and-drop') {
                <demo-dragdrop />
            }

            @case ('loader') {
                <demo-loader />
            }
            @case ('textarea') {
                <demo-textarea />
            }
        }
    </div>
</div>
